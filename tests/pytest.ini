# =============================================================================
# Pytest Configuration for Omni_Suite E2E Tests
# =============================================================================
#
# This file configures pytest for running the OPP → OL → ORF end-to-end tests.
#
# Run tests with:
#   cd /mnt/d/贯维/Omni_Suite
#   pytest tests/ -v                    # Run all tests
#   pytest tests/ -v -m e2e           # Run only E2E tests
#   pytest tests/ -v -m "requires_opp and requires_orf"  # Test specific components
#
# =============================================================================

[pytest]
# Python path - ensure all three component src directories are importable
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Test output options
addopts =
    --strict-markers
    --tb=short
    --showlocals
    -ra

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers - see conftest.py for marker definitions
markers =
    e2e: End-to-end tests exercising the complete OPP→OL→ORF pipeline
    slow: Tests that take significant time to run
    requires_opp: Tests that require OPP (Omni Pre-Processor) component
    requires_ol: Tests that require OL (Omni Localizer) component
    requires_orf: Tests that require ORF (Omni Re-Formatter) component
    requires_azure: Tests that require Azure credentials
    requires_s3: Tests that require S3 credentials
    requires_api_key: Real LLM tests; ERROR (not skip) if canonical provider keys (ARK/ZHIPU/NVIDIA) missing in .env
    nightly: Real LLM tests; CI default skip, run via -m nightly
    scene07: Multi-language E2E test scenes (3 lang pairs × 4 formats)
    smoke: Pipeline contract smoke test (manual stage, pre-commit)

# Coverage options (if pytest-cov is installed)
# Uncomment to generate coverage report:
# addopts = --cov=Omni_Pre_Processor/src --cov=Omni_Localizer/src --cov=Omni_Re_Formatter/src --cov-report=term-missing

# Test execution order
# Run unit tests first, then integration, then E2E
testpaths = tests

# Timeout for tests (requires pytest-timeout)
timeout = 300

# Parallel execution (requires pytest-xdist)
# addopts = -n auto

# =============================================================================
# Component-Specific Test Configuration
# =============================================================================

[pytest:opp]
# Configuration for OPP tests
testpaths = Omni_Pre_Processor/tests

[pytest:ol]
# Configuration for OL tests
testpaths = Omni_Localizer/tests

[pytest:orf]
# Configuration for ORF tests
testpaths = Omni_Re_Formatter/tests

# =============================================================================
# CI/CD Configuration
# =============================================================================

[pytest:ci]
# Optimized settings for CI environments
addopts =
    --strict-markers
    --tb=line
    -q
    --color=no

# Faster failure
failfast = false

# =============================================================================
# Development Configuration
# =============================================================================

[pytest:dev]
# Settings for local development
addopts =
    --strict-markers
    --tb=short
    -v

# Show extra test summary info
verbose = 2

# Run in random order to catch ordering dependencies
# addopts = -random
