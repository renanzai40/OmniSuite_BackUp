name: fidelity

on:
  push:
    branches: [main, master]
    paths:
      - 'tests/fidelity/**'
      - 'test_corpus/real/**'
      - 'test_artifacts/ol/**'
      - 'Makefile'
      - 'Omni_Localizer/src/ol_mcp/**'
      - 'Omni_Localizer/src/ol_cli.py'
  pull_request:
    branches: [main, master]
    paths:
      - 'tests/fidelity/**'
      - 'Makefile'
      - 'Omni_Localizer/src/ol_mcp/**'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  fidelity-gate:
    name: Fidelity gate (char_cosine >= 0.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install sacrebleu + opentelemetry (run_fidelity.py imports ol_mcp which imports opentelemetry)
        run: pip install --upgrade sacrebleu pip pydantic-settings python-multipart cryptography starlette aiohttp opentelemetry-api opentelemetry-sdk
      - name: Verify candidate exists
        run: |
          if [ ! -f test_artifacts/ol/alice_ch1_zhipu_real.md ]; then
            echo "ERROR: candidate test_artifacts/ol/alice_ch1_zhipu_real.md not found."
            echo "Run 'make fidelity-nightly' locally (requires ZHIPU_API_KEY) and commit the result."
            exit 1
          fi
      - name: Run fidelity gate
        run: python tests/fidelity/run_fidelity.py

  fidelity-nightly:
    name: Fidelity nightly (regenerate via Zhipu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install sacrebleu + opentelemetry (ol_mcp/tracing.py imports opentelemetry)
        run: pip install --upgrade sacrebleu litellm opentelemetry-api opentelemetry-sdk
      - name: Install OL for translate_md_text
        run: |
          git clone --depth 1 https://github.com/renanzai40/OL_BackUp.git /tmp/ol
          pip install -e "/tmp/ol[mcp]"
      - name: Regenerate candidate + score
        env:
          ARK_API_KEY: sk-dummy
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          NVIDIA_NIM_API_KEY: nvapi-dummy
          HF_ENDPOINT: 'https://hf-mirror.com'
          PYTHONPATH: /tmp/ol/src
          OL_CONFIG_PATH: /tmp/ol/config/default.yaml
        run: |
          python tests/fidelity/regenerate_candidate.py || true
          python tests/fidelity/run_fidelity.py || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-result
          path: tests/fidelity/results/alice_ch1_fidelity.json
