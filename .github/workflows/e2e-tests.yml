name: Omni Suite E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Job 1: CI-mode test suite (fast, no LLM API keys required).
  # Runs on every push/PR. Uses OMNI_TEST_FAKE_LLM=1 and
  # OMNI_TEST_FAKE_PANDOC=1 to short-circuit external network calls.
  # -------------------------------------------------------------------------
  ci-suite:
    name: CI Suite (no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"

      - name: Install system deps (pandoc for ORF MD conversions)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: 'Install weasyprint C libs (CI-G3: real PDF render in e2e)'
        run: |
          # CI-G3: install weasyprint system deps so test_md2pdf_channel.py::
          # test_convert_weasyprint_real_render_cjk can exercise a real
          # PDF render (not just the mock). Previously the e2e ci-suite
          # only installed pandoc, so PDF regressions slipped through
          # (OPP#24/26/28).
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf2.0-0 \
            shared-mime-info fontconfig

      - name: Install md2pptx (Phase C2)
        run: |
          # md2pptx is a Python script that imports pptx; install python-pptx
          # in the system Python (where md2pptx will run via its shebang)
          # before install_md2pptx.sh's --version verification.
          pip install python-pptx
          bash scripts/install_md2pptx.sh

      - name: uv sync (root workspace installs all 3 submodules via [tool.uv.workspace])
        run: uv sync --locked

      - name: Install test deps (pytest + docx/pptx/pandoc + structlog/otel + psutil + pytest-timeout + weasyprint for CI-G3)
        run: uv pip install --python .venv/bin/python pytest pyyaml python-docx python-pptx pypandoc-binary structlog opentelemetry-api opentelemetry-sdk psutil pytest-asyncio pytest-timeout weasyprint nbformat markdownify chardet openpyxl lxml boto3 azure-storage-blob moto yake fastmcp

      - name: Create .venv_ol symlink for legacy paths
        run: ln -s .venv .venv_ol

      - name: Ensure .venv/bin/python exists (uv creates python3, not python)
        run: cd .venv/bin && [ ! -e python ] && [ -e python3 ] && ln -s python3 python; cd -

      - name: Upgrade vulnerable transitive deps (CVE remediation)
        run: uv pip install --system --upgrade pip pydantic-settings python-multipart cryptography starlette aiohttp

      - name: Install 3 sub-repos as editable packages
        run: |
          uv pip install --python .venv/bin/python -e ./Omni_Pre_Processor
          uv pip install --python .venv/bin/python -e "./Omni_Localizer[mcp]"
          uv pip install --python .venv/bin/python -e ./Omni_Re_Formatter

      - name: Scan tracked configs for hardcoded secrets (Phase A2 regression)
        run: |
          if grep -rn --include="*.yaml" --include="*.yml" --include="*.json" \
              -E "(api_key|apikey|api-key)\s*[:=]\s*['\"]?[a-zA-Z0-9]{20,}" \
              Omni_Pre_Processor Omni_Localizer Omni_Re_Formatter 2>/dev/null; then
            echo "::error::Hardcoded secret detected in tracked config (Phase A2 violation)"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Run OPP module tests
        run: |
          .venv_ol/bin/python -m pytest Omni_Pre_Processor/tests/ -m "not nightly" \
            --tb=short -q --no-header 2>&1 | tail -40
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"
          OMNI_SUITE_RUNNING_OPP_TESTS: "1"

      - name: Run OL module tests
        run: |
          .venv_ol/bin/python -m pytest Omni_Localizer/tests/ -m "not nightly" \
            --tb=short -q --no-header 2>&1 | tail -40
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"

      - name: Run ORF module tests
        run: |
          .venv_ol/bin/python -m pytest Omni_Re_Formatter/tests/ \
            --tb=short -q --no-header 2>&1 | tail -40
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"

      - name: Run suite-level e2e tests
        run: |
          .venv_ol/bin/python -m pytest tests/ -m "not nightly" \
            --tb=short -q --no-header 2>&1 | tail -60
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"

      - name: Run usability verifier (CLI matrix)
        run: .venv_ol/bin/python scripts/verify_usability.py
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"
          ZHIPU_API_KEY: "sk-dummy"
          AGNES_API_KEY: "sk-dummy"
          NVIDIA_NIM_API_KEY: "nvapi-dummy"
          ORF_MCP_ALLOWED_DIRS: "/tmp:/home/runner/work/Omni_Suite"
          # OL fail-CLOSES without its own allowlist (security.py:283 ->
          # ValueError -> misleading OL_INVALID_INPUT). Note the separator:
          # OL's get_default_validator splits on ',' (ORF's parser above uses
          # ':'/';'), so this value must be comma-separated.
          OL_MCP_ALLOWED_DIRS: "/tmp,/home/runner/work/Omni_Suite"
          # MCP smoke tests fire many tool calls in quick succession; a
          # token-bucket RPM cap (default 60) trips them. Disable like
          # the validation workflow does (AGENTS.md: "Set 0 for full
          # validation runs").
          OMNI_RATE_LIMIT_RPM: "0"

      - name: Run MCP verifier
        run: .venv_ol/bin/python scripts/verify_mcp.py
        env:
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"
          ZHIPU_API_KEY: "sk-dummy"
          AGNES_API_KEY: "sk-dummy"
          NVIDIA_NIM_API_KEY: "nvapi-dummy"
          ORF_MCP_ALLOWED_DIRS: "/tmp:/home/runner/work/Omni_Suite"
          OL_MCP_ALLOWED_DIRS: "/tmp,/home/runner/work/Omni_Suite"
          OMNI_RATE_LIMIT_RPM: "0"

      - name: Clean up test artifacts
        run: rm -rf mcp_resources/ resources/ logs/ final-out/ test_artifacts/

  # -------------------------------------------------------------------------
  # Job 2: Nightly LLM tests (slow, requires real API keys).
  # Runs on a schedule + manual dispatch. Matrix: {m2.7, deepseek}.
  # Uses MINIMAX_API_KEY / BAIDU_API_KEY secrets.
  # -------------------------------------------------------------------------
  nightly-llm:
    name: Nightly LLM (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: ci-suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        provider: [minimax, baidu]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone 3 sub-repos (parent .gitignore excludes them)
        run: bash scripts/clone_subrepos.sh

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install md2pptx
        run: bash scripts/install_md2pptx.sh

      - name: uv sync
        run: uv sync --locked

      - name: Install test deps
        run: uv pip install pytest pyyaml python-docx python-pptx pypandoc-binary structlog opentelemetry-api opentelemetry-sdk psutil pytest-asyncio

      - name: Create .venv_ol symlink for legacy paths
        run: ln -s .venv .venv_ol

      - name: Ensure .venv/bin/python exists (uv creates python3, not python)
        run: cd .venv/bin && [ ! -e python ] && [ -e python3 ] && ln -s python3 python; cd -

      - name: Configure LLM credentials
        run: |
          mkdir -p Omni_Localizer/config
          cat > Omni_Localizer/.env <<EOF
          MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
          BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}
          MINIMAX_BASE_URL=https://api.minimaxi.com/v1
          BAIDU_BASE_URL=https://qianfan.baidubce.com/v2
          EOF
          cp Omni_Localizer/config/default.yaml Omni_Localizer/config/local.yaml

      - name: Run nightly real-LLM tests
        run: |
          .venv_ol/bin/python -m pytest tests/test_e2e_real_llm.py -m "nightly" \
            --tb=short -v --no-header 2>&1 | tail -80
        env:
          OMNI_TEST_FAKE_LLM: ""
          OMNI_TEST_FAKE_PANDOC: ""
          OMNI_RUN_REAL_LLM: "1"
          OL_CONFIG_PATH: Omni_Localizer/config/local.yaml
