name: pipeline-pptx-md-pptx
description: >-
  End-to-end PPTX -> OL -> ORF -> PPTX pipeline carrying the FULL
  HUMAN-QUALITY bar (draft D9) adapted to a PPTX output: real OPP
  extraction (MD + XLIFF), real-LLM OL translation, real ORF apply-md to
  PPTX, then separate quality-gate steps (opens in python-pptx, paragraph
  ratio within +-5%, CJK density < 5%, zero Chinese punctuation, LQA >=
  4.0/5 via OL JudgeService). The LQA bar is asserted at its LITERAL
  published threshold (judge_overall >= 4.0), flagged step-level
  ``known_gap: true`` because the shipped OL judge cannot meet it (T13-01);
  the weakened observation lives under scenarios/pipeline/known-gaps/ and
  is excluded from the pass bar. Requires real LLM keys -> unconfigured in
  key-less CI, GREEN in nightly (D11).
level: human-quality
category: pipeline
tier: 2
requires_env:
  - ARK_API_KEY
  - ZHIPU_API_KEY
  - NVIDIA_NIM_API_KEY
instructions: |-
  This scenario proves the MD-path pipeline (OPP extract -> ol translate-md
  -> orf apply-md) produces a PPTX that meets the end-user quality bar.

  What to do:
  1. A python step synthesizes the input fixture at runtime: a Chinese
     (zh-source) PPTX with 3 slides (title + body paragraph each, 6 text
     paragraphs total) — text-only so the round trip is paragraph-stable
     (verified: with images the OPP-emitted "## Images" section makes
     pandoc add a 4th slide and the paragraph ratio breaks 6 -> 9). The
     mandated scenarios/_fixtures/meridian_q1.pptx fixture is English (0 pics), so
     the zh source is generated for the bars to be provable. zh -> en is
     the direction the HUMAN-QUALITY bars are defined for.
  2. OPP extracts the fixture to MD + XLIFF (--target-format both).
  3. ol translate-md translates the MD with the real LLM (nightly quality
     run).
  4. ol translate-xliff translates the XLIFF — the LQA evidence input
     (faithful to omo_loop Q2).
  5. orf apply-md backfills the translated MD to PPTX (pandoc fallback —
     md2pptx is absent/broken on typical hosts; the fallback is the
     empirically exercised surface and produces 3 slides / 6 paragraphs).
  6-10. Separate quality-gate steps, each citing its own STANDARDS.md
  HUMAN-QUALITY anchor, reusing the omo_loop gate logic
  (scripts/omo_loop.py Q1-Q6) adapted to the PPTX surface.

  Bar adaptations (each documented in its step instructions):
  - The drawing-count bar (#drawing-count) is DOCX-internal by definition
    (<w:drawing in word/document.xml) — not applicable to a PPTX output;
    the source fixture is text-only (consistent with the mandated Meridian
    pptx, which has 0 pictures), so no image-preservation claim is made.
  - The opens-docx bar is DOCX-specific; the PPTX step asserts the
    python-pptx equivalent (Presentation() opens, >= 1 slide, > 0
    paragraphs).
  - The paragraph-ratio bar counts non-empty text-frame paragraphs via
    python-pptx on source vs output — the PPTX-faithful port of Q6's +-5%
    structure check.
  - LQA (#lqa-threshold): asserted at the LITERAL judge_overall >= 4.0/5
    bar, flagged step-level ``known_gap: true`` because OL's rubric/prompt
    mismatch caps judge_overall_score at 3.25/5 (T13-01); the shipped
    weakened four-dimension average lives under
    scenarios/pipeline/known-gaps/ and ACCEPTED_GAPS.md records the gap.
  Run it with the real key env (suite-root .env + Omni_Localizer/.env
  loaded) — with keys scrubbed it must report unconfigured, never
  pass/fail.
steps:
  - name: Generate synthetic Chinese PPTX fixture
    kind: python
    command: |-
      import pathlib, shutil, sys
      from pptx import Presentation
      BASE = pathlib.Path("/tmp/omni_val/pipeline-pptx")
      shutil.rmtree(BASE, ignore_errors=True)
      BASE.mkdir(parents=True)
      prs = Presentation()
      for title, body in [["全球智造科技有限公司", "公司成立于2008年，专注于工业自动化系统的研发与制造，总部位于上海。"],
                          ["核心产品", "协作机器人、视觉引导装配单元、人工智能质量检测平台，服务全球四十多个国家。"],
                          ["发展愿景", "通过智能制造技术，帮助全球制造业客户实现数字化转型。"]]:
          slide = prs.slides.add_slide(prs.slide_layouts[1])
          slide.shapes.title.text = title
          slide.placeholders[1].text = body
      prs.save(BASE / "source.pptx")
      print("OK: fixture written")
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: fixture written"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Generate the input fixture at runtime: a zh-source PPTX with 3
      slides (title + one body paragraph each = 6 text paragraphs), no
      images (text-only keeps the round trip paragraph-stable). Check:
      the snippet exits 0 and prints the OK marker.
  - name: Extract PPTX to MD + XLIFF via real OPP CLI
    kind: cli
    command: opp /tmp/omni_val/pipeline-pptx/source.pptx --target-format both --source-lang zh --target-lang en --output-dir /tmp/omni_val/pipeline-pptx/opp_out -v
    timeout_seconds: 300
    expect:
      exit_code: 0
      stderr_has: ["[INFO] Generated:"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/pipeline-pptx/opp_out/source.md
      - path: /tmp/omni_val/pipeline-pptx/opp_out/source.xlf
    instructions: |-
      Run the real OPP CLI on the generated fixture with --target-format
      both (MD + XLIFF in one pass; XLIFF is the LQA evidence input) and
      -v so the success marker is visible. Check: exit 0 and
      stderr_has "[INFO] Generated:" (OPP stdout is empty on success; the
      -v stderr marker is the success signal, STANDARDS.md#exit-codes).
  - name: Translate MD with real LLM (ol translate-md)
    kind: cli
    command: ol translate-md /tmp/omni_val/pipeline-pptx/opp_out/source.md -s zh -t en -o /tmp/omni_val/pipeline-pptx/ol_out -c Omni_Localizer/config/default.yaml
    timeout_seconds: 600
    expect:
      exit_code: 0
      stdout_has: ["Translated"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Real-LLM translation of the extracted MD (zh -> en) with the
      tracked OL config (config/default.yaml, ${ENV_VAR} key refs — the
      requires_env gate guarantees the keys are present). This is the
      nightly quality run; the output MD is what gets backfilled. Check:
      exit 0 and stdout "Translated: ..." (fresh and cached markers both
      contain "Translated").
  - name: Translate XLIFF with real LLM (LQA evidence)
    kind: cli
    command: ol translate-xliff /tmp/omni_val/pipeline-pptx/opp_out/source.xlf -s zh -t en -o /tmp/omni_val/pipeline-pptx/ol_out -c Omni_Localizer/config/default.yaml
    timeout_seconds: 600
    expect:
      exit_code: 0
      stdout_has: ["Translated"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/pipeline-pptx/ol_out/source.xlf
    instructions: |-
      Translate the XLIFF with the same real-LLM config. The translated
      XLIFF (ol_out/source.xlf) is the LQA step's input — omo_loop Q2
      judges trans-unit pairs parsed from the translated XLIFF
      (scripts/omo_loop.py:302-396). Check: exit 0 + "Translated:".
  - name: Backfill translated MD to PPTX via real ORF CLI
    kind: cli
    command: orf apply-md /tmp/omni_val/pipeline-pptx/ol_out/source.md --target-format pptx -o /tmp/omni_val/pipeline-pptx/out.pptx --no-cache
    timeout_seconds: 300
    expect:
      exit_code: 0
      stdout_has: ["Created /tmp/omni_val/pipeline-pptx/out.pptx"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/pipeline-pptx/out.pptx
    instructions: |-
      Real ORF backfill of the translated MD to PPTX. md2pptx is
      typically absent or a broken symlink, so ORF's pandoc fallback is
      the empirically exercised surface (verified: 3 slides, 6
      paragraphs, exit 0). Check: exit 0 + "Created <path>".
  - name: Assert output opens in python-pptx
    kind: python
    command: |-
      import sys
      from pptx import Presentation
      try:
          prs = Presentation("/tmp/omni_val/pipeline-pptx/out.pptx")
      except Exception as e:
          print("ERROR: python-pptx open failed: %s" % e)
          sys.exit(1)
      n = sum(len([x for x in sh.text_frame.paragraphs if x.text.strip()]) for s in prs.slides for sh in s.shapes if sh.has_text_frame)
      slides = len(prs.slides)
      if slides == 0 or n == 0:
          print("ERROR: PPTX opens with zero slides/paragraphs")
          sys.exit(1)
      print("OK: python-pptx opens, %d slides, %d paragraphs" % (slides, n))
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: python-pptx opens,"]
    standard: STANDARDS.md#opens-docx
    instructions: |-
      Q1 functional floor (scripts/omo_loop.py:191-205) in its
      PPTX-equivalent form: the pipeline exited 0, out.pptx exists, and
      python-pptx opens it with >= 1 slide and > 0 non-empty text
      paragraphs (the #opens-docx anchor is DOCX-named; this is the same
      bar for the PPTX surface). Check: exit 0 + "OK: python-pptx
      opens,".
  - name: Assert paragraph ratio within +-5% (Q6 port)
    kind: python
    command: |-
      import sys
      from pptx import Presentation
      def count_paras(p):
          prs = Presentation(p)
          return sum(len([x for x in sh.text_frame.paragraphs if x.text.strip()]) for s in prs.slides for sh in s.shapes if sh.has_text_frame)
      src_n = count_paras("/tmp/omni_val/pipeline-pptx/source.pptx")
      out_n = count_paras("/tmp/omni_val/pipeline-pptx/out.pptx")
      if src_n == 0:
          print("ERROR: source has 0 paragraphs")
          sys.exit(1)
      ratio = out_n / src_n
      if not (0.95 <= ratio <= 1.05):
          print("ERROR: para ratio %.3f out of 0.95-1.05 (src=%d out=%d)" % (ratio, src_n, out_n))
          sys.exit(1)
      print("OK: para ratio %.3f (src=%d out=%d)" % (ratio, src_n, out_n))
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: para ratio"]
    standard: STANDARDS.md#para-ratio
    instructions: |-
      Q6 roundtrip (scripts/omo_loop.py:255-273) ported to the PPTX
      surface: count non-empty text-frame paragraphs via python-pptx on
      source vs output; the ratio must lie in [0.95, 1.05]. Verified
      stable at 6 == 6 through the pandoc fallback when the source is
      text-only. Check: exit 0 + "OK: para ratio".
  - name: Assert CJK density below 5% (Q3)
    kind: python
    command: |-
      import re, sys
      from pptx import Presentation
      texts = [x.text for s in Presentation("/tmp/omni_val/pipeline-pptx/out.pptx").slides for sh in s.shapes if sh.has_text_frame for x in sh.text_frame.paragraphs if x.text.strip()]
      text = "\n".join(texts)
      if not text.strip():
          print("ERROR: PPTX text empty")
          sys.exit(1)
      cjk = re.findall(r"[\u4e00-\u9fff]", text)
      ratio = len(cjk) / len(text)
      if ratio >= 0.05:
          print("ERROR: CJK ratio %.2f%% (>= 5%%, translation incomplete)" % (ratio * 100))
          sys.exit(1)
      print("OK: CJK ratio %.2f%% (< 5%%)" % (ratio * 100))
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: CJK ratio"]
    standard: STANDARDS.md#cjk-density
    instructions: |-
      Q3 translation completeness (scripts/omo_loop.py:276-299): the
      English target must have CJK char ratio < 5% ([\u4e00-\u9fff] over
      all text-frame paragraphs); up to 5% is tolerated for brand
      names/proper nouns. Check: exit 0 + "OK: CJK ratio".
  - name: Assert zero Chinese punctuation in English output (Q5)
    kind: python
    command: |-
      import re, sys
      from pptx import Presentation
      texts = [x.text for s in Presentation("/tmp/omni_val/pipeline-pptx/out.pptx").slides for sh in s.shapes if sh.has_text_frame for x in sh.text_frame.paragraphs if x.text.strip()]
      text = "\n".join(texts)
      hits = re.findall(r"[\u201c\u201d\u2018\u2019\uff0c\u3002\uff1a\uff1b\uff01\uff1f]", text)
      if hits:
          print("ERROR: %d Chinese punctuation chars in English output" % len(hits))
          sys.exit(1)
      print("OK: 0 Chinese punctuation chars")
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: 0 Chinese punctuation chars"]
    standard: STANDARDS.md#punct-hygiene
    instructions: |-
      Q5 punctuation hygiene (scripts/omo_loop.py:230-252): an
      English-target output must contain 0 characters from
      [\u201c\u201d\u2018\u2019\uff0c\u3002\uff1a\uff1b\uff01\uff1f]
      (Chinese curly quotes, full-width comma/period/colon/semicolon/
      exclamation/question). The pandoc PPTX writer does NOT
      smart-convert apostrophes (verified 0 non-ASCII in output), so the
      strict set is enforceable here. Check: exit 0 + "OK: 0 Chinese
      punctuation chars".
  - name: Assert LQA judge_overall >= 4.0/5 — published bar (Q2)
    kind: python
    command: |-
      import os, re, sys, asyncio
      os.environ["OMNI_RATE_LIMIT_RPM"] = "0"
      xlf_text = open("/tmp/omni_val/pipeline-pptx/ol_out/source.xlf", encoding="utf-8").read()
      pairs = []
      for m in re.finditer(r'<trans-unit[^>]*id="([^"]+)"[^>]*>.*?<source[^>]*>(.*?)</source>\s*<target[^>]*>(.*?)</target>', xlf_text, re.DOTALL):
          src = re.sub(r"<[^>]+>", "", m.group(2)).strip()
          tgt = re.sub(r"<[^>]+>", "", m.group(3)).strip()
          if src and tgt and tgt != src:
              pairs.append((m.group(1), src, tgt))
          if len(pairs) >= 50:
              break
      if not pairs:
          print("ERROR: no scorable unit pairs in OL XLIFF")
          sys.exit(1)
      from ol_lqa.judge import JudgeService
      from ol_pool.router import ModelPool
      from ol_config.loader import load_config
      cfg = os.environ.get("OL_CONFIG_PATH", "Omni_Localizer/config/default.yaml")
      load_config(cfg)
      pool = ModelPool.get_instance(cfg)
      judge = JudgeService(pass_threshold=4.0, model_pool=pool)
      async def _judge_all():
          return await asyncio.gather(*[judge.judge(s, t, u, source_lang="zh", target_lang="en") for u, s, t in pairs], return_exceptions=True)
      results = asyncio.run(_judge_all())
      dims = ["adequacy", "fluency", "accuracy", "score"]
      scores = []
      overalls = []
      for r in results:
          if isinstance(r, Exception):
              continue
          scores.append([r.judge_scores.get(d, 0.0) for d in dims])
          overalls.append(r.judge_overall_score)
      if not scores:
          print("ERROR: all %d judge calls failed (transport errors)" % len(results))
          sys.exit(1)
      dim_avg5 = sum(sum(s) for s in scores) / (len(scores) * len(dims)) / 2.0
      overall5 = sum(overalls) / len(overalls) / 2.0
      print("LQA judge_overall_avg_5=%.2f dim_avg_5=%.2f n=%d (T13-01 rubric ceiling)" % (overall5, dim_avg5, len(scores)))
      if overall5 < 4.0:
          print("KNOWN-GAP: judge_overall %.2f/5 < 4.0/5 published bar (#lqa-threshold); see ACCEPTED_GAPS.md (T13-01)" % overall5)
          sys.exit(1)
      print("OK: judge_overall %.2f/5 >= 4.0/5 (n=%d)" % (overall5, len(scores)))
    timeout_seconds: 300
    known_gap: true
    expect:
      exit_code: 0
      stdout_has: ["OK: judge_overall"]
    standard: STANDARDS.md#lqa-threshold
    instructions: |-
      Q2 LLM-judged quality, the LITERAL published bar
      (scripts/omo_loop.py:302-396): parse the first <= 50 scorable
      trans-unit pairs from the translated XLIFF, judge each via OL
      JudgeService with the real model pool (config/default.yaml), and
      require the average of ``judge_overall_score`` (0-1, rescored to /5)
      >= 4.0/5 (STANDARDS.md#lqa-threshold). Flagged ``known_gap: true``:
      the T13-01 mismatch (OL's judge prompt never asked for
      terminology_consistency / format_preservation while RUBRIC_WEIGHTS
      gives them 0.35 combined weight, and _remap_llm_fields padded the
      absent dimensions with 0, capping judge_overall_score at 3.25/5) is
      FIXED IN CODE as of 2026-09-17 (Omni_Localizer src/ol_lqa/judge.py
      and src/ol_pool/router.py; regression tests/test_lqa_judge.py). The
      marker is KEPT until a tier-2 real-key run re-verifies this literal
      bar — dropping it on hermetic/unit evidence alone would be a false
      green. The failure (if any) is recorded here but excluded from this
      scenario's verdict; the shipped weakened four-dimension average lives
      under scenarios/pipeline/known-gaps/.
