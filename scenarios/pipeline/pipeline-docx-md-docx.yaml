name: pipeline-docx-md-docx
description: >-
  End-to-end DOCX -> OL -> ORF -> DOCX pipeline carrying the FULL
  HUMAN-QUALITY bar (draft D9): real OPP extraction (MD + XLIFF), real-LLM
  OL translation, real ORF backfill, then six separate quality-gate steps
  (opens in python-docx, drawing count preserved, paragraph ratio within
  +-5%, CJK density < 5%, zero Chinese punctuation, LQA >= 4.0/5 via OL
  JudgeService). Two of those bars are asserted at their LITERAL published
  threshold — #drawing-count (src == out) and #lqa-threshold
  (judge_overall >= 4.0) — flagged step-level ``known_gap: true`` because
  the shipped pipeline could not meet them (T13-02 / T13-01, both fixed in
  code 2026-09-17 — markers kept until a tier-2 re-run re-verifies the
  literal bars); their weakened observations live under
  scenarios/pipeline/known-gaps/ and are excluded from the pass bar.
  Requires real LLM keys -> unconfigured in key-less CI, GREEN in nightly (D11).
level: human-quality
category: pipeline
tier: 2
requires_env:
  - ARK_API_KEY
  - ZHIPU_API_KEY
  - NVIDIA_NIM_API_KEY
instructions: |-
  This scenario proves the MD-path pipeline (OPP extract -> ol translate-md
  -> orf apply-md) produces a DOCX that meets the end-user quality bar.

  What to do:
  1. A python step synthesizes the input fixture at runtime: a Chinese
     (zh-source) DOCX with 6 text paragraphs and 2 embedded images (image
     bytes extracted from the committed test_corpus/complex.docx — no
     committed image-bearing zh DOCX exists; the mandated Meridian fixture
     is English and has 0 drawings). zh -> en is the direction the
     HUMAN-QUALITY bars are defined for (CJK density < 5% and the
     punctuation hygiene regex apply to an English target).
  2. OPP extracts the fixture to MD + XLIFF (--target-format both).
  3. The images directory is staged next to the OL output directory so
     ORF's pandoc conversion can resolve the relative image references.
  4. ol translate-md translates the MD with the real LLM (this is the
     nightly quality run).
  5. ol translate-xliff translates the XLIFF — the translated XLIFF is the
     LQA evidence input (faithful to omo_loop Q2, which judges the
     translated XLIFF).
  6. A python step normalizes the image references in the translated MD
     (OL's repair layer occasionally mangles the shielded paths — finding
     T13-02b — so refs are pointed at the actually-staged files; the fix
     count is printed as evidence).
  7. orf apply-md backfills the translated MD to DOCX with
     --no-separate-images so pandoc embeds the images into the output
     (default --separate-images strips them into a sidecar).
  8-13. SIX separate quality-gate steps, each citing its own STANDARDS.md
  HUMAN-QUALITY anchor and each reusing the exact gate logic from
  scripts/omo_loop.py (Q1 :191-205, Q4 :208-227, Q6 :255-273, Q3 :276-299,
  Q5 :230-252, Q2 :302-396).

  Known-gap isolation (T-17, Wave-0 decision C-05): TWO gates are asserted
  at the LITERAL published bar in this scenario but flagged step-level
  ``known_gap: true`` because the shipped pipeline could not yet meet them —
  their failure is recorded (proving the gap) yet excluded from this
  scenario's verdict, so the pass bar is never silently weakened:
  - #drawing-count (T13-02): ol translate-md duplicated every ![..](..)
    image reference (level4_safe_fallback re-inserted content unshield had
    already restored; 2 refs in -> 4 out, 12 -> 24 verified), so `src == out`
    failed on any image-bearing document.
  - #lqa-threshold (T13-01): OL's LLM judge prompt never asked for
    terminology_consistency / format_preservation while RUBRIC_WEIGHTS gave
    them 0.35 combined weight, and _remap_llm_fields padded the absent
    dimensions with 0, so judge_overall_score was capped at 3.25/5.
  BOTH ROOT CAUSES ARE FIXED IN CODE (2026-09-17: Omni_Localizer
  src/ol_md/pipeline.py, src/ol_lqa/judge.py, src/ol_pool/router.py; unit
  regressions in tests/test_md_repair_pipeline.py and test_lqa_judge.py).
  The step-level ``known_gap: true`` markers are KEPT until a tier-2
  (real-key) run re-verifies these literal bars — dropping them on
  hermetic/unit evidence alone would be a false green.
  The SHIPPED weakened observations for both (drawing `out >= src`; the
  four-dimension LQA average) live under scenarios/pipeline/known-gaps/
  marked ``known_gap: true`` and are excluded from the pass bar; both gaps
  are recorded in ACCEPTED_GAPS.md.
  Run it with the real key env (suite-root .env + Omni_Localizer/.env
  loaded) — with keys scrubbed it must report unconfigured, never
  pass/fail.
steps:
  - name: Generate synthetic Chinese image-bearing DOCX fixture
    kind: python
    command: |-
      import io, pathlib, shutil, sys, zipfile
      from docx import Document
      from docx.shared import Inches
      BASE = pathlib.Path("/tmp/omni_val/pipeline-docx")
      shutil.rmtree(BASE, ignore_errors=True)
      BASE.mkdir(parents=True)
      doc = Document()
      for t in ["全球智造科技有限公司成立于2008年，专注于工业自动化系统的研发与制造。",
                "公司总部位于上海，在苏州、深圳和成都设有三个生产基地，产品远销全球四十多个国家和地区。",
                "我们的核心产品包括协作机器人、视觉引导装配单元和人工智能驱动的质量检测平台。",
                "经过十五年的发展，公司已经建立了完整的研发、生产、销售和服务体系。",
                "公司的愿景是通过智能制造技术，帮助全球制造业客户实现数字化转型。",
                "我们相信，技术创新是企业持续发展的根本动力。"]:
          doc.add_paragraph(t)
      media = zipfile.ZipFile("test_corpus/complex.docx")
      img = media.read("word/media/image1.png")
      for _ in range(2):
          doc.add_picture(io.BytesIO(img), width=Inches(2.0))
      doc.save(BASE / "source.docx")
      print("OK: fixture written")
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: fixture written"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Generate the input fixture at runtime (nothing image-bearing and
      Chinese is committed). The result must be a zh-source DOCX with 6
      text paragraphs and 2 embedded <w:drawing> images (python-docx
      add_picture of real PNG bytes extracted from the committed
      test_corpus/complex.docx). Check: the snippet exits 0 and prints the
      OK marker naming the written file.
  - name: Extract DOCX to MD + XLIFF via real OPP CLI
    kind: cli
    command: opp /tmp/omni_val/pipeline-docx/source.docx --target-format both --source-lang zh --target-lang en --output-dir /tmp/omni_val/pipeline-docx/opp_out -v
    timeout_seconds: 300
    expect:
      exit_code: 0
      stderr_has: ["[INFO] Generated:"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/pipeline-docx/opp_out/source.md
      - path: /tmp/omni_val/pipeline-docx/opp_out/source.xlf
    instructions: |-
      Run the real OPP CLI on the generated fixture with --target-format
      both (MD + XLIFF in one pass; XLIFF is the LQA evidence input) and
      -v so the success marker is visible. Check: exit 0 and
      stderr_has "[INFO] Generated:" (OPP stdout is empty on success; the
      -v stderr marker is the success signal, STANDARDS.md#exit-codes).
  - name: Stage images next to OL output directory
    kind: python
    command: |-
      import pathlib, shutil, sys
      BASE = pathlib.Path("/tmp/omni_val/pipeline-docx")
      (BASE / "ol_out").mkdir(parents=True, exist_ok=True)
      shutil.copytree(BASE / "opp_out" / "source_images", BASE / "ol_out" / "source_images", dirs_exist_ok=True)
      print("OK: images staged next to OL output")
    timeout_seconds: 120
    expect:
      exit_code: 0
      stdout_has: ["OK: images staged next to OL output"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      The translated MD references images as ./source_images/... relative
      to itself. Copy OPP's extracted source_images/ dir into the OL
      output dir so pandoc (in the ORF step) can resolve the references.
      Check: exit 0 + OK marker.
  - name: Translate MD with real LLM (ol translate-md)
    kind: cli
    command: ol translate-md /tmp/omni_val/pipeline-docx/opp_out/source.md -s zh -t en -o /tmp/omni_val/pipeline-docx/ol_out -c Omni_Localizer/config/default.yaml
    timeout_seconds: 600
    expect:
      exit_code: 0
      stdout_has: ["Translated"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Real-LLM translation of the extracted MD (zh -> en) with the
      tracked OL config (config/default.yaml, ${ENV_VAR} key refs — the
      requires_env gate guarantees the keys are present). This is the
      nightly quality run; the output MD is what gets backfilled. Check:
      exit 0 and stdout "Translated: ..." — both the fresh
      ("Translated: ...") and cached ("Translated (cached): ...") markers
      contain "Translated".
  - name: Normalize image references in translated MD
    kind: python
    command: |-
      import pathlib, re, sys
      BASE = pathlib.Path("/tmp/omni_val/pipeline-docx")
      md = BASE / "ol_out" / "source.md"
      text = md.read_text(encoding="utf-8")
      staged = list((BASE / "ol_out" / "source_images").iterdir())
      fixed = 0
      def _norm(m):
          global fixed
          alt, path = m.group(1), m.group(2)
          want = pathlib.Path(path).name.replace("_", "")
          for f in staged:
              if f.name.replace("_", "") == want:
                  if str(f) != path:
                      fixed += 1
                  return "![%s](%s)" % (alt, f)
          return m.group(0)
      new = re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", _norm, md.read_text(encoding="utf-8"))
      md.write_text(new, encoding="utf-8")
      print("OK: image refs normalized (%d fixed)" % fixed)
    timeout_seconds: 120
    expect:
      exit_code: 0
      stdout_has: ["OK: image refs normalized"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      OL's repair pipeline occasionally mangles the shielded image paths
      in the translated MD (verified: this run rewrote
      ./source_images/source_image_1.png to ./sourceimages/sourceimage_1.png
      — underscores stripped — losing every image in the backfill; finding
      T13-02b). This step rewrites every ![..](..) reference to point at
      the ACTUAL staged file (matched by basename with underscores
      removed) and reports how many refs needed fixing — the count is
      evidence of the defect. The images themselves are real and staged;
      only the reference paths are corrected. Check: exit 0 + "OK: image
      refs normalized".
  - name: Translate XLIFF with real LLM (LQA evidence)
    kind: cli
    command: ol translate-xliff /tmp/omni_val/pipeline-docx/opp_out/source.xlf -s zh -t en -o /tmp/omni_val/pipeline-docx/ol_out -c Omni_Localizer/config/default.yaml
    timeout_seconds: 600
    expect:
      exit_code: 0
      stdout_has: ["Translated"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/pipeline-docx/ol_out/source.xlf
    instructions: |-
      Translate the XLIFF with the same real-LLM config. The translated
      XLIFF (ol_out/source.xlf) is the LQA step's input — omo_loop Q2
      judges trans-unit pairs parsed from the translated XLIFF
      (scripts/omo_loop.py:302-396). Check: exit 0 + "Translated:".
  - name: Backfill translated MD to DOCX via real ORF CLI
    kind: cli
    command: orf apply-md /tmp/omni_val/pipeline-docx/ol_out/source.md --target-format docx -o /tmp/omni_val/pipeline-docx/out.docx --no-separate-images --no-cache
    timeout_seconds: 300
    expect:
      exit_code: 0
      stdout_has: ["Created /tmp/omni_val/pipeline-docx/out.docx"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/pipeline-docx/out.docx
    instructions: |-
      Real ORF backfill of the translated MD to DOCX. --no-separate-images
      is REQUIRED: the default --separate-images strips image references
      into a sidecar and pandoc never embeds them, so the output would
      lose all drawings (verified: 0 media with default, 4 with
      --no-separate-images). Check: exit 0 + "Created <path>" (both fresh
      and cached conversions print it).
  - name: Assert output opens in python-docx (Q1)
    kind: python
    command: |-
      import sys
      from docx import Document
      try:
          doc = Document("/tmp/omni_val/pipeline-docx/out.docx")
          n = len(doc.paragraphs)
      except Exception as e:
          print("ERROR: python-docx open failed: %s" % e)
          sys.exit(1)
      if n == 0:
          print("ERROR: DOCX has 0 paragraphs")
          sys.exit(1)
      print("OK: python-docx opens, %d paragraphs" % n)
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: python-docx opens,"]
    standard: STANDARDS.md#opens-docx
    instructions: |-
      Q1 functional floor (scripts/omo_loop.py:191-205): the pipeline
      exited 0, out.docx exists, python-docx opens it and it has >= 1
      paragraph. Check: exit 0 + "OK: python-docx opens, N paragraphs".
  - name: Assert drawing count preserved — published bar src == out (Q4)
    kind: python
    command: |-
      import sys, zipfile
      def _count_drawings(p):
          try:
              with zipfile.ZipFile(p) as z:
                  if "word/document.xml" not in z.namelist():
                      return 0
                  return z.read("word/document.xml").decode("utf-8", errors="ignore").count("<w:drawing")
          except Exception:
              return 0
      src = _count_drawings("/tmp/omni_val/pipeline-docx/source.docx")
      out = _count_drawings("/tmp/omni_val/pipeline-docx/out.docx")
      if src == 0:
          print("ERROR: source has 0 drawings; cannot compare")
          sys.exit(1)
      if out != src:
          print("KNOWN-GAP: drawings src=%d out=%d — published bar (#drawing-count) is src == out; see ACCEPTED_GAPS.md (T13-02)" % (src, out))
          sys.exit(1)
      print("OK: drawings src=%d out=%d (match)" % (src, out))
    timeout_seconds: 180
    known_gap: true
    expect:
      exit_code: 0
      stdout_has: ["OK: drawings src="]
    standard: STANDARDS.md#drawing-count
    instructions: |-
      Q4 drawing-count, the LITERAL published bar (scripts/omo_loop.py:208-227):
      count <w:drawing in word/document.xml of source vs output; source must
      have > 0 drawings and the counts must be EQUAL (STANDARDS.md#drawing-count).
      This step is flagged ``known_gap: true``: ol translate-md duplicated every
      ![..](..) image reference (level4_safe_fallback re-inserted content that
      unshield_markdown had already restored, because is_complete()/missing
      keyed on the shield_map key instead of its value — verified 2->4 and
      12->24, finding T13-02). FIXED IN CODE 2026-09-17
      (Omni_Localizer/src/ol_md/pipeline.py; regression
      tests/test_md_repair_pipeline.py::TestShieldValueAwareCompleteness).
      The marker is KEPT until a tier-2 real-key run re-verifies this literal
      bar — dropping it on hermetic/unit evidence alone would be a false
      green. The failure (if any) is recorded here but excluded from this
      scenario's verdict; the shipped weakened observation (out >= src) lives
      in scenarios/pipeline/known-gaps/.
  - name: Assert paragraph ratio within +-5% (Q6)
    kind: python
    command: |-
      import sys
      from docx import Document
      src_n = len(Document("/tmp/omni_val/pipeline-docx/source.docx").paragraphs)
      out_n = len(Document("/tmp/omni_val/pipeline-docx/out.docx").paragraphs)
      if src_n == 0:
          print("ERROR: source has 0 paragraphs")
          sys.exit(1)
      ratio = out_n / src_n
      if not (0.95 <= ratio <= 1.05):
          print("ERROR: para ratio %.3f out of 0.95-1.05 (src=%d out=%d)" % (ratio, src_n, out_n))
          sys.exit(1)
      print("OK: para ratio %.3f (src=%d out=%d)" % (ratio, src_n, out_n))
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: para ratio"]
    standard: STANDARDS.md#para-ratio
    instructions: |-
      Q6 roundtrip (scripts/omo_loop.py:255-273): python-docx paragraph
      count of output / source must lie in [0.95, 1.05] — the translation
      must not add or drop structure. Check: exit 0 + "OK: para ratio".
  - name: Assert CJK density below 5% (Q3)
    kind: python
    command: |-
      import re, sys
      from docx import Document
      text = "\n".join(p.text for p in Document("/tmp/omni_val/pipeline-docx/out.docx").paragraphs)
      if not text.strip():
          print("ERROR: output text empty")
          sys.exit(1)
      cjk = re.findall(r"[\u4e00-\u9fff]", text)
      ratio = len(cjk) / len(text)
      if ratio >= 0.05:
          print("ERROR: CJK ratio %.2f%% (>= 5%%, translation incomplete)" % (ratio * 100))
          sys.exit(1)
      print("OK: CJK ratio %.2f%% (< 5%%)" % (ratio * 100))
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: CJK ratio"]
    standard: STANDARDS.md#cjk-density
    instructions: |-
      Q3 translation completeness (scripts/omo_loop.py:276-299): the
      English target must have CJK char ratio < 5% ([\u4e00-\u9fff] over
      all paragraph text); up to 5% is tolerated for brand names/proper
      nouns. Check: exit 0 + "OK: CJK ratio".
  - name: Assert zero Chinese punctuation in English output (Q5)
    kind: python
    command: |-
      import re, sys
      from docx import Document
      text = "\n".join(p.text for p in Document("/tmp/omni_val/pipeline-docx/out.docx").paragraphs)
      hits = re.findall(r"[\u201c\u201d\u2018\u2019\uff0c\u3002\uff1a\uff1b\uff01\uff1f]", text)
      if hits:
          print("ERROR: %d Chinese punctuation chars in English output" % len(hits))
          sys.exit(1)
      print("OK: 0 Chinese punctuation chars")
    timeout_seconds: 180
    expect:
      exit_code: 0
      stdout_has: ["OK: 0 Chinese punctuation chars"]
    standard: STANDARDS.md#punct-hygiene
    instructions: |-
      Q5 punctuation hygiene (scripts/omo_loop.py:230-252): an
      English-target output must contain 0 characters from
      [\u201c\u201d\u2018\u2019\uff0c\u3002\uff1a\uff1b\uff01\uff1f]
      (Chinese curly quotes, full-width comma/period/colon/semicolon/
      exclamation/question). Check: exit 0 + "OK: 0 Chinese punctuation
      chars".
  - name: Assert LQA judge_overall >= 4.0/5 — published bar (Q2)
    kind: python
    command: |-
      import os, re, sys, asyncio
      os.environ["OMNI_RATE_LIMIT_RPM"] = "0"
      xlf_text = open("/tmp/omni_val/pipeline-docx/ol_out/source.xlf", encoding="utf-8").read()
      pairs = []
      for m in re.finditer(r'<trans-unit[^>]*id="([^"]+)"[^>]*>.*?<source[^>]*>(.*?)</source>\s*<target[^>]*>(.*?)</target>', xlf_text, re.DOTALL):
          src = re.sub(r"<[^>]+>", "", m.group(2)).strip()
          tgt = re.sub(r"<[^>]+>", "", m.group(3)).strip()
          if src and tgt and tgt != src:
              pairs.append((m.group(1), src, tgt))
          if len(pairs) >= 50:
              break
      if not pairs:
          print("ERROR: no scorable unit pairs in OL XLIFF")
          sys.exit(1)
      from ol_lqa.judge import JudgeService
      from ol_pool.router import ModelPool
      from ol_config.loader import load_config
      cfg = os.environ.get("OL_CONFIG_PATH", "Omni_Localizer/config/default.yaml")
      load_config(cfg)
      pool = ModelPool.get_instance(cfg)
      judge = JudgeService(pass_threshold=4.0, model_pool=pool)
      async def _judge_all():
          return await asyncio.gather(*[judge.judge(s, t, u, source_lang="zh", target_lang="en") for u, s, t in pairs], return_exceptions=True)
      results = asyncio.run(_judge_all())
      dims = ["adequacy", "fluency", "accuracy", "score"]
      scores = []
      overalls = []
      for r in results:
          if isinstance(r, Exception):
              continue
          scores.append([r.judge_scores.get(d, 0.0) for d in dims])
          overalls.append(r.judge_overall_score)
      if not scores:
          print("ERROR: all %d judge calls failed (transport errors)" % len(results))
          sys.exit(1)
      dim_avg5 = sum(sum(s) for s in scores) / (len(scores) * len(dims)) / 2.0
      overall5 = sum(overalls) / len(overalls) / 2.0
      print("LQA judge_overall_avg_5=%.2f dim_avg_5=%.2f n=%d (T13-01 rubric ceiling)" % (overall5, dim_avg5, len(scores)))
      if overall5 < 4.0:
          print("KNOWN-GAP: judge_overall %.2f/5 < 4.0/5 published bar (#lqa-threshold); see ACCEPTED_GAPS.md (T13-01)" % overall5)
          sys.exit(1)
      print("OK: judge_overall %.2f/5 >= 4.0/5 (n=%d)" % (overall5, len(scores)))
    timeout_seconds: 300
    known_gap: true
    expect:
      exit_code: 0
      stdout_has: ["OK: judge_overall"]
    standard: STANDARDS.md#lqa-threshold
    instructions: |-
      Q2 LLM-judged quality, the LITERAL published bar
      (scripts/omo_loop.py:302-396): parse the first <= 50 scorable
      trans-unit pairs from the translated XLIFF, judge each via OL
      JudgeService with the real model pool, and require the average of
      ``judge_overall_score`` (0-1, rescored to /5) >= 4.0/5
      (STANDARDS.md#lqa-threshold). This step is flagged
      ``known_gap: true``: the T13-01 mismatch (OL's judge prompt never
      asked for terminology_consistency / format_preservation while
      RUBRIC_WEIGHTS gives them 0.35 combined weight, and _remap_llm_fields
      padded the absent dimensions with 0, mathematically capping
      judge_overall_score at 3.25/5 on perfect scores) is FIXED IN CODE as
      of 2026-09-17 (Omni_Localizer src/ol_lqa/judge.py and
      src/ol_pool/router.py; regression tests/test_lqa_judge.py). The
      marker is KEPT until a tier-2 real-key run re-verifies this literal
      bar — dropping it on hermetic/unit evidence alone would be a false
      green. The failure (if any) is recorded here but excluded from this
      scenario's verdict; the shipped weakened observation (the
      four-dimension average) lives in scenarios/pipeline/known-gaps/.
