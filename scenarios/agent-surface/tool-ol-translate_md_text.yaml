name: tool-ol-translate_md_text
description: "OL translate_md_text translates markdown end-to-end (requires real LLM keys) and rejects wrong-shaped params cleanly."
level: agent-user
category: agent-surface
tier: 2
requires_env: [ARK_API_KEY, ZHIPU_API_KEY, NVIDIA_NIM_API_KEY]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'translate_md_text translates a markdown string'
    kind: python
    command: |
      import os, shutil, sys
      sys.path.insert(0, "Omni_Localizer/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      if not os.path.exists(os.path.join(FIXT, "default.yaml")):
          shutil.copy("Omni_Localizer/config/default.yaml", os.path.join(FIXT, "default.yaml"))
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import TranslateInput, translate_md_text
      r = asyncio.run(translate_md_text(params=TranslateInput(content="# Hello World\n\nThis is a test.", source_lang="en", target_lang="zh", config_path="/tmp/omni-agent-surface/default.yaml")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', '"translated"', 'source_lang', 'target_lang']
    standard: STANDARDS.md#tool-contract
    instructions: "Real LLM translation (strict no-mocks): runs only when a provider key is configured (requires_env). Expect success with the translated text under the 'translated' key."
  - name: 'translate_md_text returns a clean error for wrong-shaped params'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import translate_md_text
      r = asyncio.run(translate_md_text(params={'content': '# Hi'}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: 'Call with a plain dict; the error boundary must return a clean JSON error, no traceback.'
