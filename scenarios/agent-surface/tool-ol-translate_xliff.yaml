name: tool-ol-translate_xliff
description: "OL translate_xliff translates an XLIFF fixture (requires real LLM keys) and rejects wrong-shaped params cleanly."
level: agent-user
category: agent-surface
tier: 2
requires_env: [ARK_API_KEY, ZHIPU_API_KEY, NVIDIA_NIM_API_KEY]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'translate_xliff translates the XLIFF fixture'
    kind: python
    command: |
      import os, shutil, sys
      sys.path.insert(0, "Omni_Localizer/src")
      FIXT = "/tmp/omni-agent-surface"
      os.makedirs(FIXT, exist_ok=True)
      if not os.path.exists(os.path.join(FIXT, "sample.xlf")):
          open(os.path.join(FIXT, "sample.xlf"), "w").write('<?xml version="1.0" encoding="utf-8"?><xliff version="1.2" xmlns="urn:oasis:names:tc:xliff:document:1.2"><file original="sample.md" source-language="en" target-language="zh"><body><trans-unit id="1"><source>Hello World</source><target>你好世界</target></trans-unit></body></file></xliff>')
      if not os.path.exists(os.path.join(FIXT, "default.yaml")):
          shutil.copy("Omni_Localizer/config/default.yaml", os.path.join(FIXT, "default.yaml"))
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import TranslateXliffInput, translate_xliff
      r = asyncio.run(translate_xliff(params=TranslateXliffInput(input_path="/tmp/omni-agent-surface/sample.xlf", output_path="/tmp/omni-agent-surface/out.xlf", source_lang="en", target_lang="zh", config_path="/tmp/omni-agent-surface/default.yaml")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', 'output_path', 'units_processed']
    standard: STANDARDS.md#tool-contract
    instructions: 'Real LLM translation: runs only with a provider key (requires_env). Expect success with output_path and units_processed.'
  - name: 'translate_xliff returns a clean error for wrong-shaped params'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import translate_xliff
      r = asyncio.run(translate_xliff(params={'input_path': '/tmp/x.xlf'}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: 'Call with a plain dict; the error boundary must return a clean JSON error, no traceback.'
