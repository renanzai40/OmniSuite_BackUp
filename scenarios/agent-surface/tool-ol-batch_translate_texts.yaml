name: tool-ol-batch_translate_texts
description: "OL batch_translate_texts translates multiple texts in parallel (requires real LLM keys) and rejects wrong-shaped params cleanly."
level: agent-user
category: agent-surface
tier: 2
requires_env: [ARK_API_KEY, ZHIPU_API_KEY, NVIDIA_NIM_API_KEY, OL_CONFIG_PATH, MCP_ALLOWED_DIRECTORIES]
instructions: |
  Agent-user conformance (draft D13, mission axis 1): this scenario proves the
  live tool responds as an agent-user expects — schema-shaped arguments accepted,
  structured JSON returned, and clear parseable errors on bad input, never raw
  stack-trace soup. What to check per step is written in each step's
  instructions block; the expect block is the machine-readable half and the
  standard citation names the bar from scenarios/STANDARDS.md it enforces.

steps:
  - name: 'batch_translate_texts translates a batch of texts'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import BatchTranslateInput, batch_translate_texts
      r = asyncio.run(batch_translate_texts(params=BatchTranslateInput(texts=["Chapter one", "Chapter two"], source_lang="en", target_lang="zh")))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": true', '"results"', 'succeeded']
    standard: STANDARDS.md#tool-contract
    instructions: 'Real LLM translation: runs only with a provider key (requires_env; the batch channel resolves its config via OL_CONFIG_PATH, so that var is declared too). Expect success with results and succeeded counts.'
  - name: 'batch_translate_texts returns a clean error for wrong-shaped params'
    kind: python
    command: |
      import asyncio, json, sys
      sys.path.insert(0, "Omni_Localizer/src")
      from ol_mcp.tools import batch_translate_texts
      r = asyncio.run(batch_translate_texts(params={'texts': ['a']}))
      print(r)
    timeout_seconds: 120
    expect:
      success: true
      exit_code: 0
      stdout_has: ['"success": false']
      stdout_not_has: ['Traceback (most recent call last)']
    standard: STANDARDS.md#error-clarity
    instructions: 'Call with a plain dict; the error boundary must return a clean JSON error, no traceback.'
